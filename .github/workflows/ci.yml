name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and test
        run: mvn -B test

      - name: Package (skip tests)
        run: mvn -B -DskipTests package

      - name: Build Docker image (local tag)
        uses: docker/build-push-action@v4
        with:
          context: BackEnd
          file: BackEnd/Dockerfile
          push: false
          tags: backend:ci-latest
