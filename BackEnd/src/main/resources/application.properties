spring.application.name=backend

# Default to dev profile for local development (uses in-memory H2)
spring.profiles.active=dev

# Kết nối Database (Pass của bạn là admin123) - used when profile is not dev
spring.datasource.url=jdbc:postgresql://localhost:5432/logistics_db?sslmode=verify-full
spring.datasource.username=postgres
spring.datasource.password=admin123

# Tự động tạo bảng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8081